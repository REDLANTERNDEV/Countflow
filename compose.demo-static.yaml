# Dokploy: Docker Compose; route the domain to web:80 and enable HTTPS.
# One static server; no database, API, simulator, secrets, or persistent volumes.
name: countflow-demo-static
services:
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: static-demo
      args:
        VITE_DEMO_MODE: "true"
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /config:size=4m
      - /data:size=4m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
