name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      # TreatWarningsAsErrors is on, and NuGet audit runs during restore, so a
      # newly disclosed vulnerability in a dependency fails the build here.
      - name: Build
        working-directory: backend
        run: dotnet build --no-restore -c Release

      # Integration tests bring up real Postgres through Testcontainers — the
      # stock ledger cannot be trusted against an in-memory provider.
      - name: Test
        working-directory: backend
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      # The catalogue-parity checks and the handheld outbox's driver tests. Both
      # run on `node --test` with no build step, which is why they can gate every
      # push rather than being something somebody remembers to run.
      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Test demo configuration
        run: node --test scripts/test/*.test.cjs

      - name: Build
        working-directory: frontend
        run: pnpm build

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The generated client is committed. Regenerating it from the API's own
      # OpenAPI document and failing on a diff means the published spec can
      # never drift from what the server actually serves — the guarantee the
      # integration story depends on.
      # Absolute path: ASP.NET resolves relative paths against the project's
      # content root, not the working directory.
      #
      # The signing key is supplied explicitly rather than inherited from the
      # Development profile. Exporting the document starts the host, which runs
      # JwtOptions' ValidateOnStart — so the export would otherwise depend on
      # which launch profile happened to resolve, and fail obscurely when one
      # did not.
      - name: Export OpenAPI document
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__SigningKey: ci-openapi-export-key-not-used-to-sign-anything
        run: dotnet run --project src/Countflow.Api -- --export-openapi "$GITHUB_WORKSPACE/frontend/openapi.json"

      - name: Regenerate client and check for drift
        working-directory: frontend
        run: |
          pnpm generate:api
          git diff --exit-code -- openapi.json packages/api-client/src/schema.d.ts \
            || { echo "::error::API contract is stale. Run 'pnpm export:openapi && pnpm generate:api' and commit the result."; exit 1; }

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrator.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
