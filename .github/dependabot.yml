version: 2
# Security updates only. `open-pull-requests-limit: 0` switches off routine
# version-bump PRs for an ecosystem; Dependabot *security* PRs ignore that limit
# and still open whenever an advisory affects a dependency (provided "Dependabot
# security updates" is enabled under the repository's Settings → Code security).
# Each ecosystem keeps a security-only group so one advisory sweep is one PR.
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      dotnet-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ['*']
