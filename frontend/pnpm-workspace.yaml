packages:
  - apps/*
  - packages/*

# A single catalog keeps the console and the handheld on identical versions of
# everything shared. Two React copies across two apps is a class of bug worth
# designing out rather than debugging.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^26.6.5
  '@tanstack/react-query': ^5.104.5
  '@tanstack/react-router': ^1.170.45
  '@vitejs/plugin-react': ^6.1.2
  vite: ^8.3.4
  # TypeScript 6, not 7. The 7.x native port does not expose the JavaScript
  # compiler API (`ts.factory`), and openapi-typescript builds its output
  # through it — so the generated API client, and the contract guarantee that
  # depends on it, simply cannot be produced under 7.x today. Revisit once the
  # codegen ecosystem ships TS 7 support.
  typescript: ^6.0.3
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  vite-plugin-pwa: ^1.3.0
  dexie: ^4.4.4
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.7.0
  clsx: ^2.1.1
  lucide-react: ^1.59.0
  '@radix-ui/react-slot': ^1.5.0
  '@radix-ui/react-dialog': ^1.3.1
  '@radix-ui/react-dropdown-menu': ^2.2.1
  '@radix-ui/react-select': ^2.4.1
  '@radix-ui/react-checkbox': ^1.4.1
  '@radix-ui/react-tooltip': ^1.4.1
  '@radix-ui/react-tabs': ^1.1.21
  '@radix-ui/react-toast': ^1.2.23
  i18next: ^26.5.3
  react-i18next: ^17.1.0
  i18next-browser-languagedetector: ^8.2.1

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/router-core@1.171.21'

# Security floors for transitive dependencies of vite-plugin-pwa > workbox-build,
# which still resolves releases with disclosed advisories. Patch-level only.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'fast-uri@>=3.0.0 <3.1.8': ^3.1.8
