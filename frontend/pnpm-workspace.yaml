packages:
  - apps/*
  - packages/*

# A single catalog keeps the console and the handheld on identical versions of
# everything shared. Two React copies across two apps is a class of bug worth
# designing out rather than debugging.
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/node': ^26.2.0
  '@tanstack/react-query': ^5.101.4
  '@tanstack/react-router': ^1.170.29
  '@vitejs/plugin-react': ^6.0.5
  vite: ^8.2.1
  # TypeScript 6, not 7. The 7.x native port does not expose the JavaScript
  # compiler API (`ts.factory`), and openapi-typescript builds its output
  # through it — so the generated API client, and the contract guarantee that
  # depends on it, simply cannot be produced under 7.x today. Revisit once the
  # codegen ecosystem ships TS 7 support.
  typescript: ^7.0.2
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  vite-plugin-pwa: ^1.3.0
  dexie: ^4.4.4
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.6.0
  clsx: ^2.1.1
  lucide-react: ^1.31.0
  '@radix-ui/react-slot': ^1.3.3
  '@radix-ui/react-dialog': ^1.1.23
  '@radix-ui/react-dropdown-menu': ^2.1.24
  '@radix-ui/react-select': ^2.3.7
  '@radix-ui/react-checkbox': ^1.3.11
  '@radix-ui/react-tooltip': ^1.2.16
  '@radix-ui/react-tabs': ^1.1.21
  '@radix-ui/react-toast': ^1.2.23
  i18next: ^26.3.6
  react-i18next: ^17.0.11
  i18next-browser-languagedetector: ^8.2.1

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/router-core@1.171.21'
