<!doctype html>
<!--
  data-density="handheld" is what scales every control up: 52px targets, larger
  type, wider spacing. Same tokens as the console, different scale — the sizing
  comes from the design system rather than a separate stylesheet.
-->
<html lang="en" data-density="handheld">
  <head>
    <meta charset="UTF-8" />
    <!-- No user scaling: a pinch-zoom triggered by a gloved hand mid-scan is a
         misread waiting to happen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241C1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3EDE6" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/handheld/favicon.svg" type="image/svg+xml" />
    <title>Countflow Handheld</title>
    <!--
      Resolve the theme before first paint. On a handheld this matters more than
      on the desktop: a white flash at shift start in a dim aisle is unpleasant
      and reads as unfinished software.
    -->
    <script>
      (function () {
        // The system preference is resolved first and is what every path falls
        // back to, including the failure one. Reading storage is the part that
        // throws (a locked-down device, private browsing), and a device that
        // will not answer "what did they choose" can still answer "is it dark
        // out there" — landing on a hardcoded theme there would override the OS
        // for exactly the people who never chose anything.
        var theme = 'dark';
        try {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}

        try {
          var p = localStorage.getItem('countflow.theme');
          if (p === 'light' || p === 'dark') theme = p;
        } catch (e) {}

        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
