<!doctype html>
<html lang="en" data-density="console">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Countflow Console</title>
    <!--
      Resolve the theme before first paint. Doing this from React is one frame
      too late: the page paints with the default first, so a dark-themed session
      flashes white on every load. Kept in sync with THEME_STORAGE_KEY.
    -->
    <script>
      (function () {
        // The system preference is resolved first and is what every path falls
        // back to, including the failure one. Reading storage is the part that
        // throws (a locked-down device, private browsing), and a device that
        // will not answer "what did they choose" can still answer "is it dark
        // out there" — landing on a hardcoded theme there would override the OS
        // for exactly the people who never chose anything.
        var theme = 'dark';
        try {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}

        try {
          var p = localStorage.getItem('countflow.theme');
          if (p === 'light' || p === 'dark') theme = p;
        } catch (e) {}

        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
